name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.1-beta.1'
        required: true
        type: string
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == release/v* ]]; then
            tag="${GITHUB_REF_NAME#release/}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          app_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          app_version="${app_version%%+*}"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag $tag does not match pubspec version $app_version." >&2
            exit 1
          fi

          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  macos:
    name: Build macOS release
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate macOS runner
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --no-pub --platforms=macos --org com.iutcoder .
          git restore -- .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package unsigned macOS app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/macos/Build/Products/Release/artist_tag_vault.app
          Artist-Tag-Vault-macOS-unsigned.zip

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-asset
          path: Artist-Tag-Vault-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows x64 release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: |
          flutter create --no-pub --platforms=windows --org com.iutcoder .
          git restore -- .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: >-
          Compress-Archive
          -Path build\windows\x64\runner\Release\*
          -DestinationPath Artist-Tag-Vault-Windows-x64.zip

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-asset
          path: Artist-Tag-Vault-Windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish desktop release
    needs:
      - validate
      - macos
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download macOS release asset
        uses: actions/download-artifact@v4
        with:
          name: macos-release-asset
          path: release-assets

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release-asset
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          release_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/Artist-Tag-Vault-macOS-unsigned.zip \
            release-assets/Artist-Tag-Vault-Windows-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Artist Tag Vault $RELEASE_TAG" \
            "${release_flags[@]}" \
            --notes "Unsigned macOS and Windows x64 builds. macOS Gatekeeper may require manual approval before first launch, and Windows may display a Microsoft Defender SmartScreen warning."
