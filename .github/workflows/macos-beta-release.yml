name: macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-beta.2'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish macOS release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          app_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          app_version="${app_version%%+*}"
          tag_version="${tag#v}"
          tag_version="${tag_version%%-*}"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag $tag does not match pubspec version $app_version." >&2
            exit 1
          fi

          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate macOS runner
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --no-pub --platforms=macos --org com.iutcoder .
          git restore -- .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package unsigned macOS app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/macos/Build/Products/Release/artist_tag_vault.app
          Artist-Tag-Vault-macOS-unsigned.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          release_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            Artist-Tag-Vault-macOS-unsigned.zip \
            --target "$GITHUB_SHA" \
            --title "Artist Tag Vault $RELEASE_TAG" \
            "${release_flags[@]}" \
            --notes "Unsigned macOS build. This app is not notarized, so macOS Gatekeeper may require manual approval before first launch."
